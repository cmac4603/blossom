[package]
edition = "2024"
name = "blossom"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "blossom"
path = "./src/bin/main.rs"

[dependencies]
embedded-graphics = "0.8"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c5"] }
esp-hal = { version = "~1.1.0", features = ["esp32c5", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c5"] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c5",
] }

embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-sdmmc = "0.9.0"
embedded-hal-bus = "0.3.0"
esp-alloc = "0.10.0"
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.8.0"
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.18.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c5",
  "unstable",
  "wifi",
] }
heapless = "0.9"
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
st7735-lcd = "0.10.0"
static_cell = "2.1.1"
tinybmp = "0.7.0"
trouble-host = { version = "0.6.0", features = [
  "derive",
  "scan",
  "default-packet-pool-mtu-255",
] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
